name: pre-commit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
      # gitleaks + actionlint build from source (language: golang);
      # ubuntu-latest ships the Go toolchain preinstalled.
      - uses: pre-commit/action@v3.0.1
        env:
          SKIP: no-commit-to-branch
